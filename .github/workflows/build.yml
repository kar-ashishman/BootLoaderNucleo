name: Build Pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential gcc-arm-none-eabi
          echo "Dependencies installed successfully."
        
      - name: create directory and git clone
        run: |
          mkdir -p ~/Project
          cd ~/Project
          git clone https://github.com/your-repo/BareMinimumBootLoaderCortexM4.git .
          echo "Repository cloned successfully."

      - name: Build the project
        run: |
          cd ~/Project/BootLoaderNucleo/BareMinimumBootLoaderCortexM4
          make
          echo "Build completed successfully."